<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Badges &amp; Tooltips</title>
<style>
  :root { --bg: #ffffff; --tile: #f5f5f5; --ink: #111113; --muted: #6f7177; --chip: #ffffff; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0 10px 10px;
    background: var(--bg);
    color: var(--ink);
    font: 400 17px/1.3 -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", Arial, sans-serif;
    letter-spacing: 0.01em;
    -webkit-font-smoothing: antialiased;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
    padding: 16px 6px 18px;
  }
  header h1 { margin: 0; font: inherit; }
  header p { margin: 0; color: var(--muted); text-align: right; }

  /* Three across at most, then two, then one. */
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  @media (max-width: 1000px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 600px)  { .grid { grid-template-columns: minmax(0, 1fr); } }

  .tile {
    position: relative;
    display: block;
    aspect-ratio: 3 / 2;
    overflow: hidden;
    border-radius: 12px;
    background: var(--tile);
    color: inherit;
    text-decoration: none;
    container-type: inline-size;
  }
  /* Each tile shows the live prototype, drawn at 1200 x 800 and scaled to fit. */
  .tile iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 1200px;
    height: 800px;
    border: 0;
    transform-origin: 0 0;
    transform: scale(var(--s, 0.3));
    pointer-events: none;
  }
  .tile .label {
    position: absolute;
    left: 10px;
    bottom: 10px;
    padding: 7px 11px;
    border-radius: 7px;
    background: var(--chip);
    font-size: 14px;
    opacity: 0;
    transform: translateY(3px);
    transition: opacity 160ms ease, transform 160ms ease;
  }
  .tile:hover .label, .tile:focus-visible .label { opacity: 1; transform: none; }
  .tile:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  @media (hover: none) { .tile .label { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .tile .label { transition: none; } }
</style>
</head>
<body>
<header>
  <h1>Badges &amp; Tooltips</h1>
  <p>Advanced Interface, Week 2</p>
</header>
<main class="grid">
  <a class="tile" href="quirky/"><iframe src="quirky/" title="" loading="lazy" tabindex="-1" aria-hidden="true"></iframe><span class="label">Quirky, Information Has Weight</span></a>
  <a class="tile" href="ethereal/"><iframe src="ethereal/" title="" loading="lazy" tabindex="-1" aria-hidden="true"></iframe><span class="label">Ethereal, Fluid Interface</span></a>
  <a class="tile" href="playful/"><iframe src="playful/" title="" loading="lazy" tabindex="-1" aria-hidden="true"></iframe><span class="label">Playful, Notifications Pile Up</span></a>
  <a class="tile" href="nostalgic/"><iframe src="nostalgic/" title="" loading="lazy" tabindex="-1" aria-hidden="true"></iframe><span class="label">Nostalgic, Resolving Data</span></a>
  <a class="tile" href="playful-reading/"><iframe src="playful-reading/" title="" loading="lazy" tabindex="-1" aria-hidden="true"></iframe><span class="label">Playful, Reading Pile</span></a>
  <a class="tile" href="glass/"><iframe src="glass/" title="" loading="lazy" tabindex="-1" aria-hidden="true"></iframe><span class="label">Ethereal, Liquid Glass</span></a>
</main>
<script>
  // Keep every preview scaled to its tile's width.
  const fit = new ResizeObserver(entries => {
    for (const e of entries) e.target.style.setProperty('--s', e.contentRect.width / 1200);
  });
  document.querySelectorAll('.tile').forEach(t => fit.observe(t));
</script>
</body>
</html>
