<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Resolving Data</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
[hidden]{display:none!important}
/* Layout: a pannable canvas on a blue ground. A Resolver tag in the centre is wired to four
   frames: the two badges on its left, the two tooltips on its right. A tooltip opens as one more
   node further right. Every wire is the same line: a dot, 45 degrees, then level, a dot. Every
   frame has its top-left corner cut and a header band. Under 760px the frames stack and the page
   scrolls. Blue and white only; solid white means locked. */
:root {
  color-scheme: dark;
  --bg: #3462db;
  --fg: #ffffff;
  --muted: rgba(255, 255, 255, .74);
  --dim: rgba(255, 255, 255, .46);
  --line: rgba(255, 255, 255, .36);
  --stage: rgba(255, 255, 255, .1);
  --ring: #4872df;          /* the frame fill, flattened: the cut-out around badges and icon details */
  --wait: #8ea6ec;          /* an unresolved badge */
  --ink: #2748b4;           /* type on white */
  --sans: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 4px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 400 13px/1.5 var(--mono); overflow: hidden; -webkit-font-smoothing: antialiased; }
p, h1, h2 { margin: 0; }
button { font: inherit; color: inherit; }
.anchor:focus-visible, .seg button:focus-visible, .act:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

.app { height: 100%; }
.app.is-flow { height: auto; }

/* ---------- canvas ---------- */
.vp { position: relative; height: 100%; overflow: hidden; touch-action: none; cursor: grab; }
.vp.is-panning { cursor: grabbing; user-select: none; }
.vp.is-panning .world { pointer-events: none; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.is-flow .vp { height: auto; overflow: visible; touch-action: auto; cursor: auto; }
.is-flow .world { position: relative; }
.hud { position: absolute; z-index: 20; cursor: default; }
h1 { left: 22px; top: 20px; font: 500 13px/1.2 var(--mono); pointer-events: none; }
.hud-zoom { left: 20px; bottom: 20px; }
.is-flow h1 { position: static; padding: 20px 20px 0; }
.is-flow .hud-zoom { display: none; }

.wires { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.wires path { fill: none; stroke: var(--dim); stroke-width: 1.5; }
.wires rect { fill: var(--bg); stroke: var(--fg); stroke-width: 1.5; }
.wires g:not([data-s="empty"]) rect { fill: var(--fg); }
.wires g[data-s="locked"] path { stroke: var(--fg); }
.wires g[data-s="resolving"] path, .wires g[data-s="clearing"] path { stroke: var(--fg); stroke-dasharray: 4 6; animation: flow 420ms steps(5) infinite; }
.wires g[data-s="clearing"] path { animation-direction: reverse; animation-duration: 300ms; }
@keyframes flow { to { stroke-dashoffset: -10; } }

/* ---------- frames: top-left corner cut, header band ---------- */
.node, .frame { --cut: 12px; position: relative; isolation: isolate; }
.node { position: absolute; cursor: default; }
.node::before, .frame::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--stage); border: 1.5px solid var(--fg);
  clip-path: polygon(var(--cut) 0, 100% 0, 100% 100%, 0 100%, 0 var(--cut)); }
.node::after, .frame::after { content: ""; position: absolute; top: 0; left: 0; width: var(--cut); height: var(--cut); pointer-events: none;
  background: linear-gradient(to top left, transparent calc(50% - 1.1px), var(--fg) calc(50% - 1.1px), var(--fg) calc(50% + .6px), transparent calc(50% + .6px)); }
.node-h, .fh { height: 40px; padding: 0 14px 0 16px; display: flex; align-items: center; border-bottom: 2px solid var(--fg); font: 500 12px/1.4 var(--mono); }
h2 { font: inherit; letter-spacing: inherit; }
.node-b { padding: 18px 14px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.node--hub { display: flex; align-items: center; justify-content: center; height: 40px; font: 500 12px/1.4 var(--mono); }

/* ---------- anchor ---------- */
.wrap { position: relative; --ax: calc(76px + (var(--nw, 200px) - 76px) / 2); }
.anchor {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  width: 76px; padding: 10px 0 8px; border: 0; border-radius: var(--r);
  background: transparent; color: var(--fg); font: 500 12px/1.2 var(--sans); cursor: pointer;
}
.icon { position: relative; width: 24px; height: 24px; }
.icon svg { display: block; width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: square; }
/* hover: the icon fills white; its inner lines switch to the ground colour. No box. */
@media (hover: hover) {
  .wrap:hover .icon .s { fill: currentColor; }
  .wrap:hover .icon .d { stroke: var(--ring); }
}
.wrap[data-open] .icon .s, .anchor:focus-visible .icon .s { fill: currentColor; }
.wrap[data-open] .icon .d, .anchor:focus-visible .icon .d { stroke: var(--ring); }

/* ---------- reels and flaps ---------- */
.reel { display: inline-block; min-width: calc(var(--rw, 0) * 1ch); transform: translateY(var(--f, 0px)); }
.reel::after { content: "\200b"; }
.reel[data-state="blank"], .reel[data-state="cycling"], .reel[data-state="clearing"] { color: var(--unres); }
.flap[data-state] { color: inherit; }
.ch { display: inline-block; font-style: normal; transform: translateY(var(--f, 0px)); }
.ch[data-s="blank"], .ch[data-s="cycling"], .ch[data-s="clearing"] { color: var(--unres); }
.ch[data-s="locked"] { animation: settle 150ms step-end; }
@keyframes settle { 0% { transform: translateY(-2px); } 45% { transform: translateY(1px); } 100% { transform: translateY(0); } }
.line { white-space: pre; }
.line:has(.reel[data-state="empty"]) .static { visibility: hidden; }

/* ---------- badges ---------- */
.b { position: absolute; pointer-events: none; }
.b-dot { top: -2px; right: -3px; width: 8px; height: 8px; display: grid; place-items: center; color: var(--fg); font: 600 12px/1 var(--mono); --unres: var(--fg); }
.b-dot[data-state="locked"]::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 2px var(--ring); }
.b-dot[data-state="locked"] { animation: snap 150ms step-end; }
.b-content {
  top: -7px; left: 14px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: var(--r);
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--wait); color: var(--fg); outline: 2px solid var(--ring); --unres: rgba(255, 255, 255, .8);
  font: 600 10px/1 var(--mono); font-variant-numeric: tabular-nums; letter-spacing: .02em; white-space: nowrap;
  transform-origin: 0 100%;
}
.b-content .reel { min-width: 1ch; text-align: center; }
.b-content[data-step="0"] { visibility: hidden; }
.b-content[data-step="1"] { scale: .35; }
.b-content[data-step="2"] { scale: .7; }
.b-content[data-state="locked"] { background: var(--fg); color: var(--ink); animation: snap 150ms step-end; }
@keyframes snap { 0% { translate: 0 -2px; } 45% { translate: 0 1px; } 100% { translate: 0 0; } }

/* ---------- tooltip: one more node, wired from the frame's edge ---------- */
.conn { position: absolute; left: var(--ax); top: -6px; width: 58px; height: 28px; overflow: visible; pointer-events: none; fill: none; stroke: var(--fg); stroke-width: 1.5; }
.conn path { stroke-dasharray: 70; stroke-dashoffset: 70; }
.wrap[data-link="1"] .conn path { stroke-dashoffset: 46; }
.wrap[data-link="2"] .conn path { stroke-dashoffset: 23; }
.wrap[data-link="3"] .conn path { stroke-dashoffset: 0; }
.conn rect { fill: var(--fg); stroke: none; visibility: hidden; }
.wrap[data-link] .conn .a, .wrap[data-link="3"] .conn .b { visibility: visible; }
.tip { position: absolute; left: 76px; top: -26px; padding-left: calc(var(--ax) - 76px + 58px); z-index: 2; }
.tip[data-step="0"] { visibility: hidden; }
.frame { color: var(--fg); --unres: var(--dim); font: 400 12px/1.4 var(--mono); transform-origin: 0 20px; }
.tip[data-step="1"] .frame { scale: .3 1; }
.tip[data-step="2"] .frame { scale: .65 1; }
.fb { padding: 10px 14px 12px 16px; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.frame.plain { white-space: nowrap; }
.frame.plain .fb { font-size: 13px; font-weight: 500; }
.frame.rich { width: 222px; }
.frame.rich .fh, .frame.rich .fb { padding-inline: 14px 12px; }
.rt { font-size: 11px; font-variant-numeric: tabular-nums; }
.pg { display: flex; flex-direction: column; gap: 4px; }
.act { margin-top: 6px; padding: 5px 10px; border: 0; border-radius: var(--r); background: transparent; box-shadow: inset 0 0 0 1px var(--dim); color: var(--fg); font: 500 12px/1.2 var(--mono); white-space: pre; cursor: default; }
.act[data-ready="true"] { background: var(--fg); box-shadow: none; color: var(--ink); cursor: pointer; }
@media (hover: hover) { .act[data-ready="true"]:hover { background: var(--ink); color: var(--fg); } }

/* ---------- switches ---------- */
.seg-b { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); }
.seg button { padding: 6px 8px; border: 0; background: transparent; color: var(--fg); font: 400 12px/1.2 var(--mono); cursor: pointer; border-radius: 3px; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--ink); }
.zoom output { min-width: 46px; text-align: center; font: 400 12px/1 var(--mono); align-self: center; }

/* ---------- stacked on a phone: the tooltip opens inside its own frame ---------- */
.is-flow .node--tip .node-b { align-items: flex-start; padding: 44px 2px 18px; min-height: 126px; }
.is-flow .node--tip.is-rich .node-b { min-height: 208px; }
.is-flow .wrap { --ax: 54px; }

@media (prefers-reduced-motion: reduce) {
  .ch[data-s="locked"], .b-dot[data-state="locked"], .b-content[data-state="locked"], .wires path { animation: none !important; }
}
</style>
</head>
<body>

<div class="app" id="app">
  <div class="vp" id="vp">
    <h1 class="hud">Resolving Data</h1>

    <div class="world" id="world">
      <svg class="wires" id="wires" aria-hidden="true"></svg>

      <div class="node node--hub" id="n-res">Resolver</div>

      <section class="node" id="n-badge" aria-labelledby="h-1">
        <div class="node-h"><h2 id="h-1">Badge</h2></div>
        <div class="node-b">
          <div class="wrap">
            <button class="anchor" type="button" id="s1-anchor" aria-label="Mail, no new messages">
              <span class="icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect class="s" x="3" y="5" width="18" height="14" rx="1"/><path class="d" d="M3.5 7.5l8.5 6 8.5-6"/></svg>
                <span class="b b-content" id="badge" data-step="0" data-state="open" aria-hidden="true"></span>
              </span>
              <span class="lbl">Mail</span>
            </button>
          </div>
          <div class="seg" id="seg-count" role="group" aria-label="Badge count"><div class="seg-b">
            <button type="button" id="s1-n-none" data-n="none" aria-pressed="true">None</button>
            <button type="button" id="s1-n-1" data-n="1" aria-pressed="false">1</button>
            <button type="button" id="s1-n-3" data-n="3" aria-pressed="false">3</button>
            <button type="button" id="s1-n-7" data-n="7" aria-pressed="false">7</button>
            <button type="button" id="s1-n-12" data-n="12" aria-pressed="false">12</button>
            <button type="button" id="s1-n-99" data-n="99+" aria-pressed="false">99+</button>
          </div></div>
        </div>
      </section>

      <section class="node" id="n-dot" aria-labelledby="h-2">
        <div class="node-h"><h2 id="h-2">Dot badge</h2></div>
        <div class="node-b">
          <div class="wrap">
            <button class="anchor" type="button" id="s2-anchor" aria-label="Chat, nothing new">
              <span class="icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path class="s" d="M4 5h16v11H9.5L4 20z"/></svg>
                <span class="b b-dot" id="dot" data-state="empty" aria-hidden="true"></span>
              </span>
              <span class="lbl">Chat</span>
            </button>
          </div>
          <div class="seg" id="seg-dot" role="group" aria-label="Dot badge"><div class="seg-b">
            <button type="button" id="s2-d-none" data-d="none" aria-pressed="true">None</button>
            <button type="button" id="s2-d-dot" data-d="dot" aria-pressed="false">Dot</button>
          </div></div>
        </div>
      </section>

      <section class="node node--tip" id="n-plain" aria-labelledby="h-3">
        <div class="node-h"><h2 id="h-3">Tooltip</h2></div>
        <div class="node-b">
          <div class="wrap" id="s3-wrap">
            <button class="anchor" type="button" id="s3-anchor" aria-describedby="s3-sr">
              <span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="s" d="M6 3h8l4 4v14H6z"/><path class="d" d="M14 3v4h4"/></svg></span>
              <span class="lbl">File</span>
            </button>
            <svg class="conn" viewBox="0 0 58 28" aria-hidden="true"><path d="M0 28L28 0H58"/><rect class="a" x="-3.5" y="24.5" width="7" height="7"/><rect class="b" x="54.5" y="-3.5" width="7" height="7"/></svg>
            <div class="tip" id="s3-tip" data-step="0" aria-hidden="true">
              <div class="frame plain"><div class="fh line"><span class="static">LAST </span><span class="reel flap" id="p-word" style="--rw:8"></span></div><div class="fb line"><span class="reel flap" id="p-date" style="--rw:12"></span></div></div>
            </div>
            <span id="s3-sr" hidden>Last edited Sep 24, 1998</span>
          </div>
        </div>
      </section>

      <section class="node node--tip is-rich" id="n-rich" aria-labelledby="h-4">
        <div class="node-h"><h2 id="h-4">Rich tooltip</h2></div>
        <div class="node-b">
          <div class="wrap" id="s4-wrap">
            <button class="anchor" type="button" id="s4-anchor" aria-describedby="s4-sr">
              <span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="s" d="M6 3h8l4 4v14H6z"/><path class="d" d="M14 3v4h4"/></svg></span>
              <span class="lbl">File</span>
            </button>
            <svg class="conn" viewBox="0 0 58 28" aria-hidden="true"><path d="M0 28L28 0H58"/><rect class="a" x="-3.5" y="24.5" width="7" height="7"/><rect class="b" x="54.5" y="-3.5" width="7" height="7"/></svg>
            <div class="tip" id="s4-tip" data-step="0">
              <div class="frame rich" role="group" aria-label="File status">
                <div class="fh line" aria-hidden="true"><span class="reel flap" id="r-head" style="--rw:12"></span></div>
                <div class="fb">
                  <div class="pg" id="pg-status" aria-hidden="true"><p class="rt line"><span class="static">Last </span><span class="reel flap" id="r-pri" style="--rw:19"></span></p><p class="rt line"><span class="reel flap" id="r-sec" style="--rw:29"></span></p></div>
                  <div class="pg" id="pg-history" aria-hidden="true" hidden></div>
                  <button type="button" class="act" id="s4-action" aria-label="View history" data-ready="false"><span class="reel flap" id="r-act" aria-hidden="true"></span></button>
                </div>
              </div>
            </div>
            <span id="s4-sr" hidden>File status. Last edited Sep 24, 1998. 3 previous versions available.</span>
          </div>
        </div>
      </section>
    </div>

    <div class="hud hud-zoom seg zoom" role="group" aria-label="Zoom"><div class="seg-b">
      <button type="button" id="z-out" aria-label="Zoom out">−</button>
      <output id="z-l">100%</output>
      <button type="button" id="z-in" aria-label="Zoom in">+</button>
      <button type="button" id="z-fit">Fit</button>
    </div></div>
  </div>
</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const mq = matchMedia('(prefers-reduced-motion: reduce)');
  const rnd = n => Math.floor(Math.random() * n);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  /* ================= canvas: layout, wires, pan and zoom ================= */
  const Canvas = (() => {
    const app = $('#app'), vp = $('#vp'), world = $('#world'), svg = $('#wires'), zl = $('#z-l');
    const el = { res: $('#n-res'), badge: $('#n-badge'), dot: $('#n-dot'), plain: $('#n-plain'), rich: $('#n-rich') };
    const NS = 'http://www.w3.org/2000/svg';
    const mk = (tag, parent) => parent.appendChild(document.createElementNS(NS, tag));
    const EDGES = ['badge', 'dot', 'plain', 'rich'].map(id => {
      const g = mk('g', svg); g.dataset.s = 'empty';
      return { id, g, path: mk('path', g), a: mk('rect', g), b: mk('rect', g) };
    });
    EDGES.forEach(e => [e.a, e.b].forEach(r => { r.setAttribute('width', 7); r.setAttribute('height', 7); }));
    const V = { x: 0, y: 0, s: 1 };
    let flow = false, W = 0, H = 0, R = {}, lastW = -1, lastFlow = null;

    function place(k, x, y, w) {
      const n = el[k]; n.style.left = x + 'px'; n.style.top = y + 'px'; n.style.width = w + 'px'; n.style.setProperty('--nw', w + 'px');
      return (R[k] = { x, y, w, h: n.offsetHeight });
    }
    function layout() {
      flow = vp.clientWidth < 760;
      app.classList.toggle('is-flow', flow);
      document.body.style.overflow = flow ? 'visible' : 'hidden';
      if (flow) {
        const vw = vp.clientWidth, x = 34, w = vw - x - 16;
        let y = 20;
        place('res', x, y, 120); y += R.res.h + 28;
        for (const k of ['badge', 'dot', 'plain', 'rich']) { place(k, x, y, w); y += R[k].h + 28; }
        W = vw; H = y + 12;
      } else {
        const top = 96, gap = 56, c1 = 72, w1 = 270, g = 216, wh = 120, c2 = c1 + w1 + g, c3 = c2 + wh + g, w3 = 200;
        place('badge', c1, 0, w1); place('dot', c1, 0, w1); place('plain', c3, 0, w3); place('rich', c3, 0, w3); place('res', c2, 0, wh);
        const hL = R.badge.h + gap + R.dot.h, hR = R.plain.h + gap + R.rich.h, mid = top + Math.max(hL, hR) / 2;
        place('badge', c1, mid - hL / 2, w1); place('dot', c1, mid - hL / 2 + R.badge.h + gap, w1);
        place('plain', c3, mid - hR / 2, w3); place('rich', c3, mid - hR / 2 + R.plain.h + gap, w3);
        place('res', c2, mid - R.res.h / 2, wh);
        W = c3 + w3 + 58 + 222 + 72;
        H = Math.max(R.dot.y + R.dot.h, R.rich.y + 40 + 18 - 26 + 190) + 72;
      }
      world.style.width = W + 'px'; world.style.height = H + 'px';
      svg.setAttribute('width', W); svg.setAttribute('height', H);
      if (flow) world.style.transform = 'none';
      else if (lastFlow !== flow) fit(); else apply();
      lastFlow = flow;
      draw();
    }
    /* Every wire is the same line: out of the hub at 45 degrees, then level into the frame. */
    function draw() {
      const hub = R.res, hy = hub.y + hub.h / 2;
      EDGES.forEach(e => {
        const n = R[e.id], py = n.y + 26;
        let ax, bx, d;
        if (flow) {
          ax = hub.x; bx = n.x; const bus = 14;
          d = `M${ax} ${hy} H${bus + 10} L${bus} ${hy + 10} V${py - 10} L${bus + 10} ${py} H${bx}`;
        } else {
          const left = n.x < hub.x, dir = left ? -1 : 1;
          ax = left ? hub.x : hub.x + hub.w; bx = left ? n.x + n.w : n.x;
          d = `M${ax} ${hy} L${ax + dir * Math.abs(py - hy)} ${py} H${bx}`;
        }
        e.path.setAttribute('d', d);
        e.a.setAttribute('x', ax - 3.5); e.a.setAttribute('y', hy - 3.5);
        e.b.setAttribute('x', bx - 3.5); e.b.setAttribute('y', py - 3.5);
      });
    }
    function apply() {
      world.style.transform = `translate(${Math.round(V.x)}px,${Math.round(V.y)}px) scale(${V.s})`;
      zl.textContent = Math.round(V.s * 100) + '%';
    }
    function fit() {
      const vw = vp.clientWidth, vh = vp.clientHeight;
      V.s = clamp(Math.min(vw / W, vh / H), 0.55, 1.25);
      V.x = (vw - W * V.s) / 2; V.y = Math.max(0, (vh - H * V.s) / 2);
      apply();
    }
    function zoomAt(f, cx, cy) {
      const s = clamp(V.s * f, 0.4, 2.5), k = s / V.s;
      V.x = cx - (cx - V.x) * k; V.y = cy - (cy - V.y) * k; V.s = s; apply();
    }
    const mid = () => [vp.clientWidth / 2, vp.clientHeight / 2];
    $('#z-in').addEventListener('click', () => zoomAt(1.2, ...mid()));
    $('#z-out').addEventListener('click', () => zoomAt(1 / 1.2, ...mid()));
    $('#z-fit').addEventListener('click', fit);

    let drag = null;
    vp.addEventListener('pointerdown', e => {
      if (flow || e.button !== 0 || e.target.closest('button, .tip, .hud')) return;
      drag = { id: e.pointerId, x: e.clientX, y: e.clientY, vx: V.x, vy: V.y, moved: false };
    });
    window.addEventListener('pointermove', e => {
      if (!drag || e.pointerId !== drag.id) return;
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (!drag.moved) { if (Math.hypot(dx, dy) < 4) return; drag.moved = true; vp.classList.add('is-panning'); }
      V.x = drag.vx + dx; V.y = drag.vy + dy; apply();
    });
    const endDrag = e => { if (drag && e.pointerId === drag.id) { drag = null; vp.classList.remove('is-panning'); } };
    window.addEventListener('pointerup', endDrag);
    window.addEventListener('pointercancel', endDrag);
    vp.addEventListener('wheel', e => {
      if (flow) return;
      e.preventDefault();
      if (e.ctrlKey || e.metaKey) { const r = vp.getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY * 0.0022), e.clientX - r.left, e.clientY - r.top); }
      else { V.x -= e.deltaX; V.y -= e.deltaY; apply(); }
    }, { passive: false });
    vp.addEventListener('scroll', () => { if (!flow) { vp.scrollTop = 0; vp.scrollLeft = 0; } });
    vp.addEventListener('focusin', e => {
      if (flow || !e.target.matches(':focus-visible') || e.target.closest('.hud')) return;
      const r = e.target.getBoundingClientRect(), v = vp.getBoundingClientRect();
      let dx = 0, dy = 0;
      if (r.left < v.left + 24) dx = v.left + 24 - r.left; else if (r.right > v.right - 24) dx = v.right - 24 - r.right;
      if (r.top < v.top + 24) dy = v.top + 24 - r.top; else if (r.bottom > v.bottom - 24) dy = v.bottom - 24 - r.bottom;
      if (dx || dy) { V.x += dx; V.y += dy; apply(); }
    });
    new ResizeObserver(() => { if (vp.clientWidth !== lastW) { lastW = vp.clientWidth; layout(); } }).observe(vp);

    /* A component reports its state; the wire from the Resolver follows. */
    function set(id, st) { const e = EDGES.find(x => x.id === id); if (e) e.g.dataset.s = st; }
    return { layout, set };
  })();

  /* ================= timing ================= */
  const ENTER5 = [45, 45, 60, 75, 110];
  /* One runner per component. begin() invalidates whatever was running before it. */
  function runner() {
    let gen = 0;
    return {
      begin() {
        const me = ++gen;
        return {
          ok: () => me === gen,
          wait(ms) {
            if (mq.matches || ms <= 0) return Promise.resolve(me === gen);
            return new Promise(r => setTimeout(() => r(me === gen), Math.max(0, ms + Math.random() * 8 - 4)));
          }
        };
      }
    };
  }
  const notSame = (make, final) => prev => { let v; do { v = make(); } while (v === prev || v === final); return v; };
  const digitPick = final => notSame(() => String(rnd(10)), final);
  const symPick = notSame(() => ['-', '=', '*', '#', '/'][rnd(5)], '+');
  const seq = list => (prev, i) => list[i % list.length];

  /* ================= reel: one value that cycles, slows and locks ================= */
  class Reel {
    constructor(el, o) {
      this.el = el; this.final = o.final; this.pick = o.pick; this.unpick = o.unpick || o.pick;
      this.blank = o.blank ?? '_';
      this.state = 'empty'; this.text = '';
      el.textContent = ''; el.dataset.state = 'empty';
    }
    set(text, state, i = 0) {
      this.text = text; this.state = state;
      this.el.textContent = text;
      this.el.dataset.state = state;
      this.el.style.setProperty('--f', (i % 2 && (state === 'cycling' || state === 'clearing')) ? '-1px' : '0px');
    }
    async resolve(t, { delay = 0, durs = ENTER5 } = {}) {
      if (this.state === 'locked') return true;
      if (this.state === 'empty') this.set(this.blank, 'blank');
      if (!await t.wait(delay)) return false;
      let prev = this.text;
      for (let i = 0; i < durs.length; i++) {
        prev = this.pick(prev, i);
        this.set(prev, 'cycling', i);
        if (!await t.wait(durs[i])) return false;
      }
      this.set(this.final, 'locked');
      return true;
    }
    async clear(t, { delay = 0, frames = 1, dur = 36 } = {}) {
      if (!await t.wait(delay)) return false;
      if (this.state === 'empty') return true;
      if (this.state !== 'blank') {
        let prev = this.text;
        for (let i = 0; i < frames; i++) {
          prev = this.unpick(prev, i);
          this.set(prev, 'clearing', i);
          if (!await t.wait(dur)) return false;
        }
        this.set(this.blank, 'blank');
        if (!await t.wait(dur)) return false;
      }
      this.set('', 'empty');
      return true;
    }
  }

  /* ================= flap: a line of text that resolves character by character =================
     Left to right, each character flips through a couple of candidates and locks before the next
     one gets going; the last few slow down into the lock. It clears right to left, faster. */
  const UP = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', LOW = UP.toLowerCase(), NUM = '0123456789';
  class Flap {
    constructor(el, o) {
      this.el = el; this.final = o.final; this.alts = o.alts || []; this.on = o.on || null;
      this.cells = []; this.state = 'empty'; el.dataset.state = 'empty';
    }
    mark(state) { this.state = state; this.el.dataset.state = state; if (this.on) this.on(state); }
    put(i, ch, s, k = 0) {
      const c = this.cells[i]; c.ch = ch; c.s = s;
      c.el.textContent = ch; c.el.dataset.s = s;
      c.el.style.setProperty('--f', k % 2 ? '-1px' : '0px');
    }
    build(keep = []) {
      this.el.textContent = '';
      this.cells = [...this.final].map(() => {
        const e = document.createElement('i'); e.className = 'ch'; this.el.append(e);
        return { el: e, ch: '', s: '' };
      });
      [...this.final].forEach((f, i) => {
        if (keep[i] === f) this.put(i, f, 'locked'); else this.put(i, f === ' ' || f === ',' ? f : '_', 'blank');
      });
    }
    show() { if (this.state === 'empty') { this.build(); this.mark('blank'); } }
    hide() { this.el.textContent = ''; this.cells = []; this.mark('empty'); }
    /* Point an already-showing flap at a new value: characters that match stay locked. */
    retarget(final, alts) {
      const keep = this.state === 'empty' ? [] : this.cells.map(c => c.s === 'locked' ? c.ch : null);
      this.final = final; this.alts = alts || [];
      if (this.state !== 'empty') { this.build(keep); this.mark('blank'); }
    }
    alt(i, k) {
      const f = this.final[i], a = this.alts.length ? this.alts[k % this.alts.length][i] : null;
      if (a && a !== ' ' && a !== f) return a;
      const pool = NUM.includes(f) ? NUM : UP.includes(f) ? UP : LOW.includes(f) ? LOW : null;
      if (!pool) return f;
      let v; do { v = pool[rnd(pool.length)]; } while (v === f);
      return v;
    }
    async flip(t, i, start, durs) {
      if (!await t.wait(start)) return false;
      const f = this.final[i];
      if (this.alt(i, 0) !== f) for (let k = 0; k < durs.length; k++) {
        this.put(i, this.alt(i, k), 'cycling', k);
        if (!await t.wait(durs[k])) return false;
      }
      this.put(i, f, 'locked');
      return true;
    }
    async resolve(t, { delay = 0, step = 34, durs = [24, 36] } = {}) {
      if (this.state === 'locked') return true;
      this.show();
      if (!await t.wait(delay)) return false;
      this.mark('cycling');
      const idx = [...this.final].map((f, i) => i).filter(i => this.final[i] !== ' ' && this.cells[i].s !== 'locked');
      let at = 0;
      const jobs = idx.map((i, j) => {
        const f = 1 + 0.9 * Math.pow(Math.max(0, (j - (idx.length - 4)) / 3), 1.5), start = at;
        at += step * f;
        return this.flip(t, i, start, durs.map(d => d * f));
      });
      if (!(await Promise.all(jobs)).every(Boolean)) return false;
      this.mark('locked');
      return true;
    }
    async clear(t, { delay = 0, step = 13 } = {}) {
      if (!await t.wait(delay)) return false;
      if (this.state === 'empty') return true;
      this.mark('clearing');
      const idx = this.cells.map((c, i) => i).filter(i => this.final[i] !== ' ' && this.cells[i].s !== 'blank').reverse();
      const jobs = idx.map(async (i, j) => {
        if (!await t.wait(j * step)) return false;
        this.put(i, this.alt(i, 0), 'clearing', 1);
        if (!await t.wait(26)) return false;
        this.put(i, '_', 'blank');
        return true;
      });
      if (!(await Promise.all(jobs)).every(Boolean)) return false;
      if (!await t.wait(34)) return false;
      this.hide();
      return true;
    }
  }

  /* Containers open and collapse in hard steps, never a fade. */
  async function steps(el, key, list, t, ms = 26) {
    for (const s of list) {
      if (s === null) delete el.dataset[key]; else el.dataset[key] = s;
      if (s !== list[list.length - 1] && !await t.wait(ms)) return false;
    }
    return true;
  }
  const press = (sel, key, val) => document.querySelectorAll(sel).forEach(b => b.setAttribute('aria-pressed', String(b.dataset[key] === val)));

  /* ================= 1. badge with content ================= */
  const Badge = (() => {
    const el = $('#badge'), anchor = $('#s1-anchor'), run = runner();
    let value = null, reels = [];
    const say = st => {
      anchor.setAttribute('aria-label', value === null ? 'Mail, no new messages' : `Mail, ${value} new messages`);
      press('#seg-count button', 'n', value === null ? 'none' : String(value));
      Canvas.set('badge', st);
    };
    async function set(v) {
      const t = run.begin();
      value = v; say('resolving');
      const chars = v === '99+' ? ['9', '9', '+'] : String(v).split('');
      const old = reels.map(r => r.text);
      el.dataset.state = 'open';
      el.textContent = '';
      reels = chars.map((c, i) => {
        const s = document.createElement('span'); s.className = 'reel'; el.append(s);
        const r = new Reel(s, { final: c, pick: c === '+' ? symPick : digitPick(c) });
        if (old[i] && old[i] !== '_') r.set(old[i], 'cycling'); else r.set('_', 'blank');
        return r;
      });
      if (el.dataset.step !== '3' && !await steps(el, 'step', ['1', '2', '3'], t)) return;
      /* the first digit runs the full 45/45/60/75/110 and locks before the next one starts */
      const done = await Promise.all(reels.map((r, i) => r.resolve(t, i === 0 ? { delay: 45, durs: ENTER5 } : { delay: 45 + 335 + (i - 1) * 195, durs: [45, 60, 90] })));
      if (done.every(Boolean) && t.ok()) { el.dataset.state = 'locked'; say('locked'); }
    }
    async function clear() {
      if (value === null) return;
      const t = run.begin();
      value = null; say('clearing');
      el.dataset.state = 'open';
      const done = await Promise.all(reels.map((r, i) => r.clear(t, { delay: (reels.length - 1 - i) * 60, frames: 3, dur: 36 })));
      if (!done.every(Boolean)) return;
      if (!await steps(el, 'step', ['2', '1', '0'], t)) return;
      el.textContent = ''; reels = []; say('empty');
    }
    document.querySelectorAll('#seg-count button').forEach(b => b.addEventListener('click', () => {
      const n = b.dataset.n;
      if (n === 'none') clear(); else set(/\D/.test(n) ? n : Number(n));
    }));
    return { set, clear };
  })();

  /* ================= 2. badge without content ================= */
  const Dot = (() => {
    const el = $('#dot'), anchor = $('#s2-anchor'), run = runner();
    /* ASCII marks get denser until the signal resolves into a solid dot */
    const reel = new Reel(el, { final: '', pick: seq(['.', '+', '*', '#']), unpick: seq(['#', '*', '+', '.']) });
    let on = false;
    async function show(want) {
      if (want === on) return;
      on = want;
      anchor.setAttribute('aria-label', on ? 'Chat, new activity' : 'Chat, nothing new');
      press('#seg-dot button', 'd', on ? 'dot' : 'none');
      Canvas.set('dot', on ? 'resolving' : 'clearing');
      const t = run.begin();
      const ok = on ? await reel.resolve(t, { delay: 45, durs: [40, 45, 60, 85] }) : await reel.clear(t, { frames: 4, dur: 34 });
      if (ok) Canvas.set('dot', on ? 'locked' : 'empty');
    }
    document.querySelectorAll('#seg-dot button').forEach(b => b.addEventListener('click', () => show(b.dataset.d === 'dot')));
    return { show };
  })();

  /* ================= tooltips: dot, line, dot, frame, then the text ================= */
  function makeTip({ id, wrap, anchor, tip, plan, all, onClosed }) {
    const run = runner();
    let isOpen = false, timer = null, lastPtr = 'mouse';
    async function open() {
      clearTimeout(timer);
      if (isOpen) return; isOpen = true; wrap.dataset.open = '';
      const t = run.begin(), p = plan();
      Canvas.set(id, 'resolving');
      p.forEach(x => x.reel.show());
      if (wrap.dataset.link !== '3' && !await steps(wrap, 'link', ['1', '2', '3'], t, 24)) return;
      if (!await t.wait(24)) return;
      if (tip.dataset.step !== '3' && !await steps(tip, 'step', ['1', '2', '3'], t)) return;
      const done = await Promise.all(p.map(x => x.reel.resolve(t, { delay: x.delay, ...x.opt })));
      if (done.every(Boolean)) Canvas.set(id, 'locked');
    }
    async function close() {
      clearTimeout(timer);
      if (!isOpen) return; isOpen = false; delete wrap.dataset.open;
      const t = run.begin();
      Canvas.set(id, 'clearing');
      const done = await Promise.all(all().map(x => x.reel.clear(t, { delay: x.out || 0 })));
      if (!done.every(Boolean)) return;
      if (!await steps(tip, 'step', ['2', '1', '0'], t)) return;
      if (!await t.wait(20)) return;
      if (!await steps(wrap, 'link', ['2', '1', null], t, 20)) return;
      Canvas.set(id, 'empty');
      if (onClosed) onClosed();
    }
    wrap.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') open(); });
    wrap.addEventListener('pointerleave', e => {
      if (e.pointerType !== 'mouse') return;
      clearTimeout(timer);
      timer = setTimeout(() => { if (!wrap.querySelector(':focus-visible')) close(); }, 140);
    });
    wrap.addEventListener('pointerdown', e => { lastPtr = e.pointerType; });
    wrap.addEventListener('focusin', e => { if (e.target.matches(':focus-visible')) open(); });
    wrap.addEventListener('focusout', e => { if (!wrap.contains(e.relatedTarget)) close(); });
    wrap.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
    anchor.addEventListener('click', e => {
      const pt = e.pointerType !== undefined ? e.pointerType : lastPtr;
      if (pt === 'mouse') open(); else if (isOpen) close(); else open();
    });
    document.addEventListener('pointerdown', e => { if (!wrap.contains(e.target)) close(); });
    return { open, close, run, isOpen: () => isOpen };
  }

  /* ================= 3. plain tooltip ================= */
  (() => {
    const plan = [
      { reel: new Flap($('#p-word'), { final: 'EDITED', alts: ['OPENED', 'SAVED', 'ACCESSED'] }), delay: 45, out: 60 },
      { reel: new Flap($('#p-date'), { final: 'SEP 24, 1998', alts: ['NOV 18, 2004', 'JAN 03, 1996', 'JUL 11, 2001'] }), delay: 170, out: 0 }
    ];
    makeTip({ id: 'plain', wrap: $('#s3-wrap'), anchor: $('#s3-anchor'), tip: $('#s3-tip'), plan: () => plan, all: () => plan });
  })();

  /* ================= 4. rich tooltip: status, and the history its action opens in place ================= */
  (() => {
    const act = $('#s4-action'), pgS = $('#pg-status'), pgH = $('#pg-history');
    const head = new Flap($('#r-head'), { final: 'FILE STATUS', alts: ['FILE LENGTH', 'FILE RECORD'] });
    const action = new Flap($('#r-act'), { final: 'VIEW HISTORY →', alts: ['OPEN ARCHIVE →', 'SHOW DETAILS →'],
      on: s => { act.dataset.ready = String(s === 'locked'); } });
    /* header, then primary, then secondary, then the action; cleared in the opposite order */
    const status = [
      { reel: new Flap($('#r-pri'), { final: 'edited Sep 24, 1998', alts: ['opened Nov 18, 2004', 'viewed Jan 03, 1996', 'copied Jul 11, 2001'] }), delay: 150, out: 80 },
      { reel: new Flap($('#r-sec'), { final: '3 previous versions available' }), delay: 560, opt: { step: 13, durs: [22] }, out: 40 }
    ];
    const history = [['v3', 'Sep 11, 1998  41 KB'], ['v2', 'Aug 30, 1998  38 KB'], ['v1', 'Aug 02, 1998  29 KB']].map(([v, row], i) => {
      const p = document.createElement('p'); p.className = 'rt line';
      p.innerHTML = `<span class="static">${v}  </span><span class="reel flap" style="--rw:19"></span>`;
      pgH.append(p);
      return { reel: new Flap(p.querySelector('.reel'), { final: row }), delay: 150 + i * 210, opt: { step: 20, durs: [22, 30] }, out: 40 + (2 - i) * 40 };
    });
    const headP = { reel: head, delay: 0, out: 150 };
    const PAGES = {
      status: { head: ['FILE STATUS', ['FILE LENGTH', 'FILE RECORD']], act: ['VIEW HISTORY →', ['OPEN ARCHIVE →', 'SHOW DETAILS →']], label: 'View history', body: status, actDelay: 700 },
      history: { head: ['FILE HISTORY', ['FILE ARCHIVE', 'FILE VERSION']], act: ['← BACK', ['← EXIT', '← DONE']], label: 'Back to file status', body: history, actDelay: 720 }
    };
    let page = 'status';
    function point(to) {
      page = to; const P = PAGES[to];
      pgS.hidden = to !== 'status'; pgH.hidden = to !== 'history';
      head.retarget(...P.head); action.retarget(...P.act);
      act.setAttribute('aria-label', P.label);
    }
    const plan = () => [headP, ...PAGES[page].body, { reel: action, delay: PAGES[page].actDelay, out: 0 }];
    const all = () => [headP, ...status, ...history, { reel: action, out: 0 }];
    const tip = makeTip({ id: 'rich', wrap: $('#s4-wrap'), anchor: $('#s4-anchor'), tip: $('#s4-tip'), plan, all, onClosed: () => point('status') });

    /* The action is real: the body de-resolves, then the other page resolves in the same frame. */
    async function swap() {
      const t = tip.run.begin(), from = PAGES[page].body;
      Canvas.set('rich', 'clearing');
      const gone = await Promise.all([action.clear(t), ...from.map(x => x.reel.clear(t, { delay: x.out }))]);
      if (!gone.every(Boolean)) return;
      point(page === 'status' ? 'history' : 'status');
      Canvas.set('rich', 'resolving');
      const p = plan(); p.forEach(x => x.reel.show());
      const done = await Promise.all(p.map(x => x.reel.resolve(t, { delay: x.delay, ...x.opt })));
      if (done.every(Boolean)) Canvas.set('rich', 'locked');
    }
    act.addEventListener('click', () => { if (act.dataset.ready === 'true' && tip.isOpen()) swap(); });
  })();

  /* ================= on load ================= */
  Canvas.layout();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => Canvas.layout());
  setTimeout(() => { Badge.set(7); setTimeout(() => Dot.show(true), 300); }, 700);
})();
</script>
</body>
</html>
